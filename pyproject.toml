[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ss-hot"
version = "0.1.0"
description = "Reusable seagrass semantic segmentation helpers (UPerNet on a ConvNeXt-Tiny encoder) for HOT fAIr model onboarding."
readme = "README.md"
requires-python = ">=3.12"
# Inference core only (the CPU serving image installs just this plus onnxruntime, which the fAIr serving
# base provides): numpy/Pillow for preprocessing, rasterio/pyproj for georeferencing. No torch.
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
]

[project.optional-dependencies]
# What the fAIr training image installs: fine-tuning, evaluation and ONNX export. The CUDA build of torch is chosen
# by the image (a CUDA wheel index), not by this metadata. timm supplies the ConvNeXt encoder; its ImageNet weights
# are downloaded from the Hugging Face Hub the first time a pretrained model is built.
train = [
    "onnx>=1.17",
    "timm>=1.0",
    "torch>=2.4",
]
# Run an exported ONNX locally. The fAIr serving base brings its own onnxruntime.
infer = [
    "onnxruntime>=1.18",
]
test = [
    "onnxruntime>=1.18",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ss_hot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the train extra, pretrained weights and local data; run with `-m integration`.
addopts = "-m 'not integration'"
markers = ["integration: needs the train extra, downloaded weights or local data (opt-in)"]

[tool.ruff]
line-length = 110
